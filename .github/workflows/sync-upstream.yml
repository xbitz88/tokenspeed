name: Upstream Sync Watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream
        run: |
          gh repo sync ${GITHUB_REPOSITORY} -b main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
